name: 'alnz_data_vault'
version: '1.0.0'
config-version: 2

# In dbt Cloud the active profile/connection is configured in the UI, so this value
# is effectively ignored — it only needs to exist. (For local dbt Core it would point
# at a profiles.yml entry.)
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ----------------------------------------------------------------------------------
# Materialization strategy (Data Vault best practice)
#   staging   -> views        : cheap, always-fresh transformations, no storage cost
#   raw_vault -> incremental   : hubs/links/satellites are INSERT-ONLY (append history,
#                                never update/delete) — the core principle of Data Vault
#
# Everything builds into your dbt Cloud dev schema; models are name-prefixed
# (stg_ / hub_ / link_ / sat_ / raw_) so layers stay readable in one schema.
# Schema-per-layer (raw / staging / raw_vault) is the production pattern — see
# docs/ARCHITECTURE.md for how to enable it with +schema configs.
# ----------------------------------------------------------------------------------
# ----------------------------------------------------------------------------------
# Framework toggles (Data Quality & Data Contract Framework — see docs/DATA_QUALITY.md)
# Advanced/observability tooling is OFF by default so a bare install only needs
# dbt_utils. Flip a var (and uncomment the package in packages.yml, then `dbt deps`)
# to activate a tier.
# ----------------------------------------------------------------------------------
vars:
  use_dbt_expectations: false   # richer value/range/regex/distribution assertions
  use_elementary: false         # anomaly detection + test-result observability

models:
  alnz_data_vault:
    staging:
      +materialized: view
    raw_vault:
      +materialized: incremental
      +on_schema_change: append_new_columns
    # marts = the PUBLIC, consumer-facing interface. Contracts + access governance
    # apply here only (internal layers above stay flexible). See docs/DATA_QUALITY.md.
    marts:
      +materialized: table
      +access: public
      +contract:
        enforced: true

# store_failures lands failing rows in a table for triage (Snowflake + dbt Cloud).
tests:
  alnz_data_vault:
    +store_failures: true

seeds:
  alnz_data_vault:
    +quote_columns: false
